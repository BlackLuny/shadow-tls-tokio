[package]
name = "shadow-tls-tokio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tokio-based implementation of ShadowTLS protocol"
repository = "https://github.com/BlackLuny/shadow-tls-tokio"

[lib]
name = "shadow_tls"
path = "src/lib.rs"

[[bin]]
name = "shadow-tls-client"
path = "src/bin/client.rs"
required-features = ["bin-client"]

[[bin]]
name = "shadow-tls-server"
path = "src/bin/server.rs"
required-features = ["bin-server"]

[features]
default = ["client"]
# Server-only consumers can disable default features to omit the TLS client stack.
client = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:webpki-roots",
    "tokio/net",
]
# CLI plumbing shared by both binaries. `clap` + `tracing-subscriber` are pure binary
# concerns; library consumers must not pay for them (tracing-subscriber alone pulls
# matchers/nu-ansi-term/sharded-slab/thread_local/regex-automata).
cli = ["dep:clap", "dep:tracing-subscriber", "tokio/rt-multi-thread", "tokio/net"]
# `shadow-tls-server` deliberately does NOT imply `client`: src/bin/server.rs only
# touches the server half.
bin-server = ["cli"]
bin-client = ["cli", "client"]
# Convenience: both binaries.
bin = ["bin-client", "bin-server"]

[dependencies]
# Async runtime. Lib needs io-util (AsyncReadExt/AsyncWriteExt), sync (oneshot) and
# macros (`select!`); `net` / `rt-multi-thread` are pulled in by the bin feature.
tokio = { version = "1", default-features = false, features = ["io-util", "sync", "macros"] }

# The workspace patch supplies the ClientHello session ID hook for the client.
rustls = { version = "=0.23.44", default-features = false, features = ["aws-lc-rs", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
webpki-roots = { version = "1.0.10", optional = true }

# Crypto — kept on the same RustCrypto generation (digest 0.11) as the rest of the
# zfc/private_tun graph so sha1/sha2 are not compiled twice.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

# Utilities
byteorder = "1"
# Same major as zf-worker's direct `rand` so rand 0.8 + rand_chacha 0.3 disappear
# from the graph.
rand = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
pin-project-lite = "0.2"
bytes = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-test = "0.4"

# Cargo patches apply at the build root. Client consumers must repeat this pin.
[patch.crates-io]
rustls = { git = "https://github.com/BlackLuny/rustls", rev = "6a0e60cc54ebc9a17cce66b60d59902ab4b38826" }
